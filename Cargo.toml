[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive", "rc", "alloc"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }

nmrs = "3.5.7"


ipnet = { version = "2.12.2", features = ["ser_as_str", "serde"] }
zbus_systemd = { version = "0.26200.0", features = ["systemd1", "zbus-async-tokio", "locale1", "login1", "hostname1", "timesync1", "timedate1", "resolve1"] }


ltrace = "0.1.3"
tracing = { version = "0.1.44", features = ["async-await", "log"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["time", "tracing", "tracing-serde", "serde", "local-time", "chrono", "env-filter"] }

uom = "0.38.0"
bytesize = { version = "2.7.0", features = ["serde"] }

clap = { version = "4.6.7", features = ["derive", "env", "unicode"] }
fs2 = "0.4.3"



